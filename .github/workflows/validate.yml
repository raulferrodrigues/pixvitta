name: Validate

# Every PR is tested, typechecked, and built before it can reach a release.
# The release builds run the same `pnpm validate`, but only after CI has
# already committed the version. The native core's sample-file corpus is
# checked on every PR too.
#
# It also runs on every push to dev. PRs can only restore caches saved on their
# own branch or their base branch, so this is what lets the Cargo and apt
# caches carry over from one PR to the next.

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: pixvitta-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

  browser-tests:
    name: Stage and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron
        run: pnpm exec install-electron

      - name: Install a virtual display and Electron's libraries
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libatk-bridge2.0-0t64

      - name: Stage tests
        run: pnpm test:stage

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  native-corpus:
    name: Native corpus check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libmpv
        uses: ./.github/actions/apt-install
        with:
          packages: libmpv-dev

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/core/target
          key: native-cargo-${{ runner.os }}-${{ hashFiles('native/core/Cargo.lock') }}
          restore-keys: native-cargo-${{ runner.os }}-

      - name: Corpus check
        run: cargo test --release --manifest-path native/core/Cargo.toml --test corpus
