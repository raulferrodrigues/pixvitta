name: Version Check

# CI owns the version (see scripts/release-version.mjs). Flag PRs into dev,
# and hotfix PRs into main, that edit the version themselves. Even if one is
# merged anyway, CI discards the hand edit. dev -> main PRs are skipped: their
# version change is CI's own bumps on dev.

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  version:
    name: Version is left to CI
    if: github.event.pull_request.base.ref != 'main' || github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compare with the branch point
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare against the merge base, not the base branch tip: dev's tip
          # moves every time CI bumps it, which says nothing about this PR.
          merge_base="$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}")"
          version_at() {
            git show "$1:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"
          }
          before="$(version_at "$merge_base")"
          after="$(version_at "$HEAD_SHA")"
          if [ "$before" != "$after" ]; then
            echo "::error file=package.json::This PR changes the version from ${before} to ${after}. Revert it: CI sets the version. It bumps the patch when a PR lands on dev or a release:hotfix PR lands on main, the minor when dev merges into main, and the major when that PR has the release:major label."
            exit 1
          fi
          echo "Version unchanged (${after})."
