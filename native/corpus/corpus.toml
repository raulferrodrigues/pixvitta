width = 96
height = 64
reference = "pattern.png"
max_error = 0.5

[[sample]]
file = "gif/animated.gif"
width = 96
height = 64
reference = "pattern.png"
max_error = 0.5
frames = [100, 200, 300]
frame_references = ["pattern.png", "pattern-mirrored.png", "pattern-flipped.png"]
note = "3 frames; every frame is checked, and that the first follows the last"

[[sample]]
file = "gif/short-delays.gif"
width = 8
height = 8
frames = [100, 100, 20]
note = "delays of 0, 10 and 20 ms; 10 ms or less is shown for 100 ms, as browsers do"

# WebP
[[sample]]
file = "webp/lossy.webp"
