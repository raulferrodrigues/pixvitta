# Folder scan: samples/scan/ is listed through pv_folder_open, and the
# listing must match these entries. Every file in it has one.
[[scan]]
file = "scan/png"
kind = "image"

[[scan]]
file = "scan/photo.dat"
kind = "image"
note = "a JPEG with an extension that says nothing"

[[scan]]
file = "scan/svg"
kind = "image"

[[scan]]
file = "scan/mp4"
kind = "video"

[[scan]]
file = "scan/text.gif"
kind = "image"
note = "text, listed by its extension without being read; it fails to open"

[[scan]]
file = "scan/tiff"
kind = "none"
note = "TIFF is not listed by content: camera RAW files start the same way"

[[scan]]
file = "scan/vorbis"
kind = "none"
note = "Ogg Vorbis audio"

[[scan]]
