width = 96
height = 64
reference = "pattern-alpha.png"
max_error = 0.5

[[sample]]
file = "webp/animated.webp"
width = 96
height = 64
reference = "pattern.png"
# image-webp blends like libwebp's anim_decode, which rounds opaque pixels
# of a blended frame down by one level, so frames 2 and 3 are off by 0.75.
max_error = 1
frames = [100, 200, 300]
frame_references = ["pattern.png", "pattern-mirrored.png", "pattern-flipped.png"]
note = "3 frames; every frame is checked, and that the first follows the last"

