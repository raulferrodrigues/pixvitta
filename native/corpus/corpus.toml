# The sample-file corpus: what each file in samples/ must produce.
# How the files were made, and how to add one: README.md next to this file.
#
# Fields:
#   file              path under samples/
#   width, height     size as shown, after EXIF orientation
#   reference         image in references/ the pixels must roughly match
#   max_error         mean difference per channel allowed, 0-255 (default 3)
#   duration          video only: seconds, within 0.15
#   expected_failure  why the core can't open it yet; the test fails if
#                     it starts passing, so the line gets removed
#   note              shown in the output, not checked

# JPEG
[[sample]]
file = "jpeg/baseline-420.jpg"
width = 96
height = 64
reference = "pattern.png"

[[sample]]
file = "jpeg/progressive.jpg"
width = 256
height = 192
reference = "photo.png"

[[sample]]
file = "jpeg/orientation-3.jpg"
width = 96
height = 64
reference = "pattern.png"

[[sample]]
file = "jpeg/orientation-6.jpg"
width = 96
height = 64
reference = "pattern.png"

[[sample]]
file = "jpeg/cmyk.jpg"
width = 96
height = 64
reference = "pattern.png"
max_error = 4

[[sample]]
file = "jpeg/adobe-rgb.jpg"
width = 96
height = 64
reference = "pattern.png"

