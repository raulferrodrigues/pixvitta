[package]
name = "pixvitta-core"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
name = "pixvitta_core"
# rlib lets the corpus test (tests/corpus.rs) call the C API.
crate-type = ["staticlib", "rlib"]

[dependencies]
avif-parse = "2.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
# Without "rayon": decodes on the calling thread, with no thread pool of its
# own. "moxcms" lets it convert embedded ICC profiles.
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"] }
moxcms = { version = "0.8", default-features = false }
# Without "asm": its x86-64 assembly needs nasm.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[dev-dependencies]
toml = "0.9"

[[test]]
name = "corpus"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
