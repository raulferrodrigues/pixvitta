[package]
name = "pixvitta-core"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
name = "pixvitta_core"
# rlib lets the corpus test (tests/corpus.rs) call the C API.
crate-type = ["staticlib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
moxcms = { version = "0.8", default-features = false }

[dev-dependencies]
toml = "0.9"

[[test]]
name = "corpus"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
